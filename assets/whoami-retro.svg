<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="AKEI - 創設者・最高技術責任者 | フルスタックエンジニア | ものづくりが好き。">
  <title>AKEI</title>
  <defs>
    <style>
      .ttl{font-family:Impact,'Arial Black','Haettenschweiler','Segoe UI Black',sans-serif;font-weight:900}
      .jp{font-family:'Yu Gothic','Hiragino Sans','Noto Sans JP','Meiryo',sans-serif;font-weight:900}
      .mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace;font-weight:800}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes spinr{to{transform:rotate(-360deg)}}
      .spin{animation:spin 60s linear infinite}
      .spinr{animation:spinr 24s linear infinite}
      @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
      .tw{animation:tw 2.4s ease-in-out infinite}
      .tw2{animation:tw 3.1s ease-in-out infinite;animation-delay:-1s}
      .tw3{animation:tw 1.8s ease-in-out infinite;animation-delay:-.5s}
      @keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}
      .pulse{animation:pulse 1.2s ease-in-out infinite}
    </style>

    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0530"/>
      <stop offset=".55" stop-color="#3a0e6b"/>
      <stop offset="1" stop-color="#d6247f"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff04d"/>
      <stop offset=".55" stop-color="#ff9a3d"/>
      <stop offset="1" stop-color="#ff2a8a"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0a52"/>
      <stop offset="1" stop-color="#0a0322"/>
    </linearGradient>
    <linearGradient id="titleG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#fff2fa"/>
      <stop offset="1" stop-color="#ffc2e0"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2a8a"/>
      <stop offset=".5" stop-color="#ffe94d"/>
      <stop offset="1" stop-color="#2ee6ff"/>
    </linearGradient>
    <linearGradient id="hp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dff6a"/>
      <stop offset="1" stop-color="#ffe94d"/>
    </linearGradient>
    <linearGradient id="sp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ee6ff"/>
      <stop offset="1" stop-color="#b26bff"/>
    </linearGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75">
      <stop offset=".6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </radialGradient>
    <radialGradient id="speedFade" cx="1110" cy="150" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000"/>
      <stop offset=".22" stop-color="#000"/>
      <stop offset="1" stop-color="#fff"/>
    </radialGradient>

    <clipPath id="frame"><rect width="1200" height="300" rx="16"/></clipPath>
    <clipPath id="aboveHorizon"><rect x="0" y="0" width="1200" height="236"/></clipPath>

    <mask id="speedMask" maskUnits="userSpaceOnUse" x="-300" y="-300" width="1800" height="900">
      <rect x="-300" y="-300" width="1800" height="900" fill="url(#speedFade)"/>
    </mask>
    <mask id="sunStripes" maskUnits="userSpaceOnUse" x="100" y="20" width="260" height="260">
      <rect x="100" y="20" width="260" height="260" fill="#fff"/>
      <rect x="100" y="168" width="260" height="3" fill="#000"/>
      <rect x="100" y="186" width="260" height="5" fill="#000"/>
      <rect x="100" y="204" width="260" height="7" fill="#000"/>
      <rect x="100" y="220" width="260" height="9" fill="#000"/>
    </mask>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.3" fill="#000" opacity=".4"/></pattern>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="4" cy="4" r="1.6" fill="#ff7ac0"/></pattern>
    <pattern id="hazard" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="20" fill="#ff2a8a"/><rect x="10" width="10" height="20" fill="#2ee6ff"/>
    </pattern>

    <path id="spark" d="M0 -9 Q1.2 -1.2 9 0 Q1.2 1.2 0 9 Q-1.2 1.2 -9 0 Q-1.2 -1.2 0 -9 Z"/>
  </defs>

  <g clip-path="url(#frame)">
    <!-- SKY -->
    <rect width="1200" height="300" fill="url(#sky)"/>
    <rect width="520" height="236" fill="url(#dots)" opacity=".11"/>
    <g fill="#fff">
      <circle cx="540" cy="30" r="1.4" class="tw"/><circle cx="610" cy="62" r="1.2" class="tw2"/>
      <circle cx="700" cy="24" r="1.6" class="tw3"/><circle cx="780" cy="70" r="1.2" class="tw"/>
      <circle cx="860" cy="38" r="1.4" class="tw2"/><circle cx="930" cy="82" r="1.1" class="tw3"/>
      <circle cx="80" cy="60" r="1.3" class="tw"/><circle cx="150" cy="30" r="1.5" class="tw2"/>
      <circle cx="420" cy="48" r="1.2" class="tw3"/>
    </g>

    <!-- SPEED LINES / BURST (right) -->
    <g style="transform-origin:1110px 150px" class="spin">
      <circle cx="1110" cy="150" r="320" fill="none" stroke="#ffe94d" stroke-width="640" stroke-dasharray="10 50" opacity=".22" mask="url(#speedMask)"/>
      <circle cx="1110" cy="150" r="320" fill="none" stroke="#2ee6ff" stroke-width="640" stroke-dasharray="6 54" stroke-dashoffset="-25" opacity=".18" mask="url(#speedMask)"/>
    </g>

    <!-- RETRO SUN -->
    <g clip-path="url(#aboveHorizon)">
      <circle cx="230" cy="150" r="124" fill="#ff2a8a" opacity=".35" filter="url(#blur6)"/>
      <circle cx="230" cy="150" r="118" fill="url(#sun)" mask="url(#sunStripes)"/>
    </g>

    <!-- FLOOR GRID -->
    <rect y="236" width="1200" height="64" fill="url(#floor)"/>
    <g stroke="#ff4fb0" stroke-width="1.2" opacity=".85" filter="url(#glow)">
      <line x1="0" y1="236" x2="1200" y2="236" stroke="#2ee6ff" stroke-width="1.6"/>
      <line x1="0" y1="243" x2="1200" y2="243"/><line x1="0" y1="252" x2="1200" y2="252"/>
      <line x1="0" y1="263" x2="1200" y2="263"/><line x1="0" y1="277" x2="1200" y2="277"/>
      <line x1="0" y1="295" x2="1200" y2="295"/>
    </g>
    <g stroke="#ff4fb0" stroke-width="1.1" opacity=".7">
      <line x1="600" y1="236" x2="-520" y2="300"/><line x1="600" y1="236" x2="-360" y2="300"/>
      <line x1="600" y1="236" x2="-200" y2="300"/><line x1="600" y1="236" x2="-40" y2="300"/>
      <line x1="600" y1="236" x2="120" y2="300"/><line x1="600" y1="236" x2="280" y2="300"/>
      <line x1="600" y1="236" x2="440" y2="300"/><line x1="600" y1="236" x2="600" y2="300"/>
      <line x1="600" y1="236" x2="760" y2="300"/><line x1="600" y1="236" x2="920" y2="300"/>
      <line x1="600" y1="236" x2="1080" y2="300"/><line x1="600" y1="236" x2="1240" y2="300"/>
      <line x1="600" y1="236" x2="1400" y2="300"/><line x1="600" y1="236" x2="1560" y2="300"/>
      <line x1="600" y1="236" x2="1720" y2="300"/>
    </g>

    <!-- DIAGONAL SLASHES -->
    <g opacity=".9">
      <polygon points="470,0 520,0 380,300 330,300" fill="#2ee6ff" opacity=".08"/>
      <polygon points="1000,0 1010,0 930,300 920,300" fill="#ffe94d" opacity=".18"/>
      <polygon points="40,300 52,300 140,0 128,0" fill="#fff" opacity=".07"/>
    </g>

    <!-- TITLE : AKEI -->
    <g transform="translate(44 0) skewX(-12)">
      <text x="58" y="208" font-size="132" letter-spacing="6" class="ttl" fill="#12062e" stroke="#12062e" stroke-width="16" stroke-linejoin="round" opacity=".9">AKEI</text>
      <text x="50" y="200" font-size="132" letter-spacing="6" class="ttl" fill="#12062e" stroke="#ffe94d" stroke-width="6" stroke-linejoin="round">AKEI</text>
      <text x="50" y="200" font-size="132" letter-spacing="6" class="ttl" fill="#2ee6ff" opacity=".9">AKEI<animate attributeName="x" values="46;46;40;54;46;46" keyTimes="0;.86;.89;.92;.95;1" dur="4.5s" repeatCount="indefinite"/></text>
      <text x="50" y="200" font-size="132" letter-spacing="6" class="ttl" fill="#ff2a8a" opacity=".9">AKEI<animate attributeName="x" values="54;54;60;46;54;54" keyTimes="0;.86;.89;.92;.95;1" dur="4.5s" repeatCount="indefinite"/></text>
      <text x="50" y="200" font-size="132" letter-spacing="6" class="ttl" fill="url(#titleG)" stroke="#12062e" stroke-width="2" paint-order="stroke">AKEI</text>
      <rect x="52" y="214" width="330" height="5" fill="url(#neon)" filter="url(#glow)"/>
    </g>

    <!-- JAPANESE (after AKEI) -->
    <g transform="translate(26 0) skewX(-8)">
      <text x="466" y="104" font-size="52" letter-spacing="10" class="jp" fill="#12062e" stroke="#12062e" stroke-width="10" stroke-linejoin="round">アケイ</text>
      <text x="466" y="104" font-size="52" letter-spacing="10" class="jp" fill="#fff" stroke="#ff2a8a" stroke-width="2" paint-order="stroke" filter="url(#glow)">アケイ</text>

      <text x="466" y="146" font-size="22" letter-spacing="2" class="jp" fill="#ffe94d">創設者・最高技術責任者 <tspan fill="#ff7ac0">｜</tspan> フルスタックエンジニア</text>
      <text x="466" y="176" font-size="22" letter-spacing="2" class="jp" fill="#fff">ものづくりが好き。</text>

      <g class="jp" font-size="17" text-anchor="middle">
        <rect x="466" y="196" width="86" height="30" fill="#ff2a8a" fill-opacity=".25" stroke="#ff2a8a" stroke-width="2"/>
        <text x="509" y="217" fill="#ffd6ec">設計</text>
        <rect x="566" y="196" width="86" height="30" fill="#2ee6ff" fill-opacity=".2" stroke="#2ee6ff" stroke-width="2"/>
        <text x="609" y="217" fill="#c8fbff">開発</text>
        <rect x="666" y="196" width="150" height="30" fill="#b26bff" fill-opacity=".25" stroke="#b26bff" stroke-width="2"/>
        <text x="741" y="217" fill="#ecd9ff">セキュリティ</text>
        <rect x="830" y="196" width="86" height="30" fill="#ffe94d" fill-opacity=".2" stroke="#ffe94d" stroke-width="2"/>
        <text x="873" y="217" fill="#fff6b0">創造</text>
      </g>
    </g>

    <!-- BADGE (right) -->
    <g>
      <g style="transform-origin:1110px 150px" class="spinr">
        <circle cx="1110" cy="150" r="78" fill="none" stroke="#2ee6ff" stroke-width="2" stroke-dasharray="3 9" opacity=".9"/>
      </g>
      <polygon points="1110,94 1158.5,122 1158.5,178 1110,206 1061.5,178 1061.5,122" fill="#12062e" stroke="#ffe94d" stroke-width="4" filter="url(#glow)"/>
      <polygon points="1110,104 1149.8,127 1149.8,173 1110,196 1070.2,173 1070.2,127" fill="#ff2a8a" fill-opacity=".35" stroke="#ff2a8a" stroke-width="2"/>
      <text x="1110" y="170" text-anchor="middle" font-size="52" class="jp" fill="#fff" stroke="#12062e" stroke-width="3" paint-order="stroke">闘</text>
    </g>

    <!-- HUD -->
    <g class="mono" font-size="12">
      <text x="30" y="27" fill="#ffe94d">HP</text>
      <rect x="52" y="15" width="226" height="16" fill="#12062e" fill-opacity=".7" stroke="#fff" stroke-width="1.5" transform="skewX(-12) translate(3.5 0)"/>
      <line x1="58" y1="23" x2="272" y2="23" stroke="url(#hp)" stroke-width="8" stroke-dasharray="12 3" class="pulse" transform="skewX(-12) translate(4.8 0)"/>
      <text x="1170" y="27" text-anchor="end" fill="#2ee6ff">SP</text>
      <rect x="922" y="15" width="226" height="16" fill="#12062e" fill-opacity=".7" stroke="#fff" stroke-width="1.5" transform="skewX(-12) translate(3.5 0)"/>
      <line x1="928" y1="23" x2="1142" y2="23" stroke="url(#sp)" stroke-width="8" stroke-dasharray="12 3" transform="skewX(-12) translate(4.8 0)">
        <animate attributeName="stroke-dashoffset" from="0" to="-15" dur=".6s" repeatCount="indefinite"/>
      </line>
    </g>
    <text x="600" y="27" text-anchor="middle" class="jp" font-size="13" letter-spacing="10" fill="#ffd6ec" opacity=".9">自己紹介</text>

    <!-- SPARKS -->
    <g fill="#fff">
      <use href="#spark" x="440" y="110" class="tw"/>
      <use href="#spark" x="1040" y="60" class="tw2"/>
      <use href="#spark" x="1180" y="230" class="tw3"/>
      <use href="#spark" x="30" y="190" class="tw2"/>
      <use href="#spark" x="960" y="215" class="tw"/>
    </g>

    <!-- RETRO FX -->
    <rect width="1200" height="300" fill="url(#scan)" opacity=".4"/>
    <rect width="1200" height="300" filter="url(#noise)" opacity=".1" style="mix-blend-mode:overlay"/>
    <rect width="1200" height="18" fill="#fff" opacity=".06">
      <animate attributeName="y" from="-20" to="300" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect width="1200" height="300" fill="url(#vig)"/>

    <!-- hazard edges -->
    <rect x="0" y="0" width="1200" height="5" fill="url(#hazard)" opacity=".85"/>
    <rect x="0" y="295" width="1200" height="5" fill="url(#hazard)" opacity=".85"/>
  </g>

  <!-- BORDER -->
  <rect x="3" y="3" width="1194" height="294" rx="14" fill="none" stroke="url(#neon)" stroke-width="3" filter="url(#glow)"/>
  <rect x="10" y="10" width="1180" height="280" rx="9" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="1" stroke-dasharray="6 6"/>
  <g stroke="#ffe94d" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M18 44 V18 H44"/><path d="M1182 44 V18 H1156"/>
    <path d="M18 256 V282 H44"/><path d="M1182 256 V282 H1156"/>
  </g>
</svg>
