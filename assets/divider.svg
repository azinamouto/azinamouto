<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="100%" height="60" role="img" aria-label="divider">
  <defs>
    <linearGradient id="n" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#b967ff"/>
      <stop offset="0.75" stop-color="#ff2e88"/>
      <stop offset="1" stop-color="#ff2e88" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#g)">
    <path d="M40 30 H380" stroke="url(#n)" stroke-width="2"/>
    <path d="M520 30 H860" stroke="url(#n)" stroke-width="2"/>
    <polygon points="450,10 470,30 450,50 430,30" fill="none" stroke="#b967ff" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0 450 30" to="360 450 30" dur="8s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="450,20 460,30 450,40 440,30" fill="#ff2e88">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </polygon>
    <circle cx="395" cy="30" r="3" fill="#00f0ff"><animate attributeName="r" values="2;4;2" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="505" cy="30" r="3" fill="#ff2e88"><animate attributeName="r" values="4;2;4" dur="1.6s" repeatCount="indefinite"/></circle>
    <rect x="20" y="28" width="12" height="4" fill="#00f0ff"/>
    <rect x="868" y="28" width="12" height="4" fill="#ff2e88"/>
  </g>
  <circle r="3" fill="#ff7eb6" opacity="0.9">
    <animateMotion dur="5s" repeatCount="indefinite" path="M40 30 H860"/>
  </circle>
</svg>
